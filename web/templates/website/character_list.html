{% extends "website/base.html" %}

{% block titleblock %}
{{ view.page_title }}
{% endblock %}

{% block content %}

{% load addclass %}
<div class="row">
  <div class="col">
    <div class="card">
      <div class="card-body">
        <h1 class="card-title">{{ view.page_title }}</h1>
        <hr />

          <ul>
              {% for char in object_list %}
              <li><a href="{{ char.web_get_detail_url }}">{{ char }}</a> - {{ char.db.appstatus }} </li>
              {% endfor %}
          </ul>

          <ul>
            <li><a class="nav-link" href="{% url 'groups' %}">Groups</a></li>
              <!-- {% for group in group_list %}
              <li><a href="{{ group.web_get_detail_url }}">{{ group }}</a> </li>
              {% endfor %} -->
          </ul>
          
      </div>
    </div>
  </div>
</div>
{% endblock %}
